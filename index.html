<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubasree - Puzzle Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ec4899; /* Pink */
            --secondary: #8b5cf6; /* Violet */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            /* Animated Mass Gradient Background */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 
                        inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Premium Indented Puzzle Slots */
        .puzzle-slot {
            width: 2.8rem;
            height: 3.2rem;
            border-radius: 12px;
            margin: 0.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.08), 
                        inset -2px -2px 6px rgba(255,255,255,0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            .puzzle-slot {
                width: 4rem;
                height: 4.5rem;
                margin: 0.2rem;
                border-radius: 16px;
            }
        }

        /* Connecting Jigsaw Piece Style */
        .puzzle-piece {
            background: linear-gradient(145deg, #ffffff, #f3f4f6);
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            user-select: none;
            box-shadow: 
                -4px -4px 8px rgba(255,255,255,0.9),
                4px 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.8rem;
            height: 3.2rem;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--secondary);
            margin: 0.25rem;
            border: 1px solid rgba(255,255,255,0.8);
        }

        @media (min-width: 768px) {
            .puzzle-piece {
                width: 4rem;
                height: 4.5rem;
                font-size: 2rem;
                margin: 0.5rem;
            }
        }

        /* Puzzle Tab (Right Side) */
        .puzzle-piece::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: linear-gradient(145deg, #ffffff, #f3f4f6);
            border-radius: 50%;
            box-shadow: 3px 0 4px rgba(0,0,0,0.08);
            z-index: -1;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .puzzle-piece::after {
                right: -12px;
                width: 24px;
                height: 24px;
            }
        }

        .puzzle-slot .puzzle-piece::after {
            display: none; 
        }

        .puzzle-piece.scattered {
            transform: rotate(var(--rot));
        }

        .puzzle-piece.scattered:hover {
            transform: rotate(0deg) translateY(-8px) scale(1.15);
            box-shadow: 0 15px 25px rgba(139, 92, 246, 0.25);
            color: var(--primary);
            z-index: 10;
            border-color: var(--primary);
        }

        .puzzle-slot .puzzle-piece {
            margin: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            cursor: default;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: var(--primary);
            background: #fff;
        }

        @media (min-width: 768px) {
            .puzzle-slot .puzzle-piece { border-radius: 16px; }
        }

        @keyframes popIn {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .puzzle-piece.error {
            background: linear-gradient(145deg, #fee2e2, #fca5a5) !important;
            color: #ef4444 !important;
            border-color: #ef4444 !important;
            animation: shake 0.4s;
        }

        .puzzle-piece.locked {
            pointer-events: none;
        }

        .puzzle-piece.fade-out {
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            pointer-events: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) translateY(-2px) rotate(-5deg); }
            75% { transform: translateX(8px) translateY(2px) rotate(5deg); }
        }

        .typing-container {
            font-family: 'Playfair Display', serif;
            min-height: 150px;
        }

        @media (min-width: 768px) {
            .typing-container {
                min-height: 220px;
            }
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: var(--primary);
            margin-left: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 0;
            z-index: 50;
        }

        /* =========================================================
           BULLETPROOF MOBILE LANDSCAPE OVERRIDE 
           ========================================================= */
        @media screen and (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 0 !important;
            }

            .main-container {
                display: flex !important;
                flex-direction: row !important;
                height: 100dvh !important;
                width: 100vw !important;
                max-width: none !important;
                gap: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                border-radius: 0 !important;
            }

            .glass-panel {
                flex: 1 !important;
                width: 50% !important;
                height: 100dvh !important;
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0.5rem 1rem !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                overflow-y: auto !important;
                background: rgba(255, 255, 255, 0.4) !important;
            }

            #wish-panel {
                background: rgba(255, 255, 255, 0.5) !important;
                border-left: 1px solid rgba(255,255,255,0.4) !important;
            }

            .puzzle-slot {
                width: 1.6rem !important;
                height: 2rem !important;
                margin: 0.1rem !important;
                border-radius: 8px !important;
            }
            .puzzle-piece {
                width: 1.6rem !important;
                height: 2rem !important;
                font-size: 1rem !important;
                margin: 0.1rem !important;
                border-radius: 8px !important;
            }
            .puzzle-piece::after {
                width: 8px !important;
                height: 8px !important;
                right: -4px !important;
            }

            #solved-area { 
                flex-wrap: nowrap !important;
                min-height: 2.2rem !important; 
                padding: 0.1rem !important; 
                width: auto !important;
            }

            #scattered-area { 
                min-height: 60px !important; 
                gap: 0.2rem !important; 
                padding: 0.1rem !important; 
            }

            header h1 { font-size: 1.5rem !important; margin-bottom: 0 !important; }
            header p { font-size: 0.65rem !important; margin-bottom: 0.1rem !important; }
            
            p.uppercase { font-size: 0.55rem !important; margin-bottom: 0.1rem !important; }
            .mb-2 { margin-bottom: 0.2rem !important; }

            #initial-state .text-7xl { font-size: 2.2rem !important; margin-bottom: 0.2rem !important; }
            #initial-state h2 { font-size: 0.8rem !important; line-height: 1.2 !important; }
            
            #wish-state svg { width: 1.5rem !important; height: 1.5rem !important; }
            #wish-state span { padding: 0.4rem !important; margin-bottom: 0.2rem !important; }
            
            .typing-container { font-size: 0.9rem !important; min-height: 80px !important; line-height: 1.3 !important; }
            
            #restart-btn { margin-top: 0.25rem !important; }
            #restart-btn button { padding: 0.3rem 1rem !important; font-size: 0.75rem !important; }

            .pointer-events-none { display: none !important; }
            #lives-display { font-size: 0.9rem !important; margin-bottom: 0.2rem !important; }
        }
    </style>
</head>
<body class="p-2 md:p-8">

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="fixed inset-0 bg-slate-900/95 z-50 hidden flex-col items-center justify-center text-white transition-opacity duration-500 backdrop-blur-md" style="opacity: 0;">
        <div class="text-7xl mb-4 animate-bounce">💀</div>
        <h2 class="text-4xl font-black text-center px-6 mb-2 text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-pink-500">Game Over!</h2>
        <p class="text-slate-300 text-lg text-center px-4 mb-8">You ran out of lives.</p>
        <button onclick="window.location.reload()" class="bg-gradient-to-r from-red-500 to-pink-500 text-white px-10 py-4 rounded-full font-bold hover:opacity-90 transition transform hover:scale-105 shadow-[0_0_20px_rgba(236,72,153,0.5)]">
            Try Again
        </button>
    </div>

    <!-- Rotation Overlay -->
    <div id="rotate-overlay" class="fixed inset-0 bg-slate-900/95 z-50 hidden flex-col items-center justify-center text-white transition-opacity duration-500 backdrop-blur-md" style="opacity: 0;">
        <svg class="w-24 h-24 mb-6 text-pink-400 animate-[spin_3s_ease-in-out]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <h2 class="text-4xl font-black text-center px-6 mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-violet-400">Tilt your phone sideways!</h2>
        <p class="text-slate-300 text-xl text-center px-4">Rotate to reveal Rubasree's special wish.</p>
    </div>

    <div class="main-container max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-8 items-stretch mx-auto relative z-10">
        
        <!-- Left Side: The Puzzle -->
        <div class="glass-panel p-4 md:p-10 flex flex-col h-full relative">
            <header class="mb-2 md:mb-6 text-center">
                <h1 class="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-600 mb-1 md:mb-3 tracking-tight drop-shadow-sm">Word Hunt</h1>
                <p class="text-gray-600 font-bold text-xs md:text-base">Find the letters in order. Wrong letters cost a life!</p>
            </header>

            <div class="flex-grow flex flex-col justify-center w-full">
                <!-- Unified Input Board -->
                <div class="mb-2 md:mb-4 w-full flex flex-col items-center p-3 md:p-6 bg-white/30 border border-white/60 rounded-2xl shadow-[inset_0_4px_10px_rgba(0,0,0,0.05)]">
                    <!-- Lives Display -->
                    <div id="lives-display" class="flex justify-center gap-2 mb-3 md:mb-5 text-2xl md:text-3xl tracking-widest drop-shadow-md">
                        <!-- Hearts injected here via JS with animations -->
                    </div>

                    <!-- Single Input Row -->
                    <div id="solved-area" class="flex flex-nowrap justify-center items-center w-full max-w-full overflow-x-auto mb-1">
                        <!-- Empty slots injected here -->
                    </div>
                </div>

                <!-- Area for scattered pieces -->
                <div class="mt-3 md:mt-6">
                    <p class="text-[0.7rem] md:text-sm font-black text-violet-500 uppercase tracking-widest mb-2 text-center drop-shadow-sm">Your Letters</p>
                    <div id="scattered-area" class="flex flex-wrap justify-center items-center gap-2 md:gap-3 p-1 md:p-4 min-h-[100px] md:min-h-[160px]">
                        <!-- Scrambled letters & decoys will be injected here -->
                    </div>
                </div>
            </div>

            <div class="mt-3 md:mt-6 text-center">
                <div class="w-full bg-white/50 h-3 rounded-full mt-2 overflow-hidden border border-white/60 shadow-inner">
                    <div id="progress-bar" class="bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-500 h-full transition-all duration-500 relative" style="width: 0%">
                        <div class="absolute inset-0 bg-white/30 animate-pulse"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: The Wish -->
        <div id="wish-panel" class="glass-panel p-4 md:p-10 flex flex-col items-center justify-center text-center relative overflow-hidden">
            <div id="initial-state" class="flex flex-col items-center transition-opacity duration-500">
                <div class="relative mb-4 md:mb-8">
                    <div class="absolute inset-0 bg-white rounded-full blur-2xl opacity-60 animate-pulse"></div>
                    <div class="text-6xl md:text-8xl opacity-90 relative z-10 hover:scale-110 transition-transform duration-300">🧩</div>
                </div>
                <h2 class="text-lg md:text-2xl font-bold text-gray-600 italic leading-relaxed">Filter out the noise.<br>Complete the word to reveal the wish...</h2>
            </div>

            <div id="wish-state" class="hidden w-full z-10">
                <div class="mb-4 md:mb-8 flex justify-center">
                    <span class="inline-flex items-center justify-center p-3 md:p-5 rounded-full bg-gradient-to-br from-pink-100 to-violet-100 text-pink-500 mb-1 md:mb-4 shadow-[inset_0_2px_10px_rgba(236,72,153,0.2)]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-12 md:w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                    </span>
                </div>
                <div id="typing-text" class="typing-container text-xl md:text-4xl text-gray-800 leading-relaxed italic font-bold drop-shadow-sm"></div>
                <div id="restart-btn" class="hidden mt-6 md:mt-12">
                    <button onclick="window.location.href='cake.html'" class="bg-gradient-to-r from-pink-500 to-violet-500 text-white px-8 py-3 md:px-12 md:py-4 rounded-full font-bold hover:opacity-90 transition transform hover:scale-105 shadow-[0_0_20px_rgba(139,92,246,0.4)] text-lg">
                        You wanna see?
                    </button>
                </div>
            </div>

            <!-- Background Blobs -->
            <div class="absolute -bottom-20 -right-20 w-40 h-40 md:w-80 md:h-80 bg-pink-300 rounded-full opacity-30 blur-[60px] z-0 pointer-events-none"></div>
            <div class="absolute -top-20 -left-20 w-40 h-40 md:w-80 md:h-80 bg-violet-300 rounded-full opacity-30 blur-[60px] z-0 pointer-events-none"></div>
        </div>
    </div>

    <script>
        const targetWord = "RUBASREE";
        const letters = targetWord.split('');
        const decoys = ['M', 'K', 'L', 'P', 'T', 'H', 'O', 'Z']; 
        
        let currentIndex = 0;
        let mistakesCount = 0;
        const maxMistakes = 6;
        let isAnimating = false;

        const wishMessage = `Happy Birthday to my best friend.
You’ve been there in every moment.
Life is better with you in it.
More memories, more laughs, same bond.
Stay the same always.`;

        function updateLivesDisplay() {
            const container = document.getElementById('lives-display');
            const remaining = maxMistakes - mistakesCount;
            let hearts = '';
            for(let i=0; i < remaining; i++) {
                hearts += '<span class="inline-block animate-[pulse_1.5s_ease-in-out_infinite] transform scale-110 drop-shadow-md">❤️</span>';
            }
            for(let i=0; i < mistakesCount; i++) {
                hearts += '<span class="inline-block opacity-40 grayscale scale-90 transition-all duration-300">🖤</span>';
            }
            container.innerHTML = hearts;
        }

        function initGame() {
            const scatteredArea = document.getElementById('scattered-area');
            const solvedArea = document.getElementById('solved-area');
            
            updateLivesDisplay();

            // 1. Create Empty Slots for the Target Word
            letters.forEach((char, index) => {
                const slot = document.createElement('div');
                slot.className = 'puzzle-slot';
                slot.id = `slot-${index}`;
                solvedArea.appendChild(slot);
            });

            // 2. Prepare the Deck
            let deck = [
                ...letters.map((char) => ({ char, isTarget: true })),
                ...decoys.map((char) => ({ char, isTarget: false }))
            ];
            
            // Shuffle
            deck.sort(() => Math.random() - 0.5);

            // 3. Render Scattered Pieces
            deck.forEach((item) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece scattered';
                piece.textContent = item.char;
                
                const randomRot = Math.floor(Math.random() * 40) - 20;
                piece.style.setProperty('--rot', `${randomRot}deg`);
                
                piece.onclick = () => handlePieceClick(piece, item.char, item.isTarget);
                scatteredArea.appendChild(piece);
            });
        }

        function handlePieceClick(piece, char, isTarget) {
            // Prevent multiple clicks while animating or if game over
            if (piece.classList.contains('locked') || isAnimating || mistakesCount >= maxMistakes) return;

            const targetSlot = document.getElementById(`slot-${currentIndex}`);
            const scatteredArea = document.getElementById('scattered-area');

            if (char === targetWord[currentIndex]) {
                // Correct piece, correct order!
                piece.classList.remove('scattered');
                piece.classList.add('locked');
                piece.style.transform = 'none'; 
                
                targetSlot.innerHTML = ''; 
                targetSlot.style.border = 'none'; 
                targetSlot.style.background = 'transparent';
                targetSlot.style.boxShadow = 'none';
                targetSlot.appendChild(piece);
                
                currentIndex++;
                updateProgress();

                if (currentIndex === targetWord.length) {
                    isAnimating = true;
                    document.querySelectorAll('.scattered').forEach(p => p.classList.add('fade-out'));
                    setTimeout(() => {
                        handleWinSequence();
                    }, 800);
                }
            } else {
                // WRONG PIECE (Decoy or out-of-order target)
                isAnimating = true;
                
                // Move it into the slot visually
                piece.classList.remove('scattered');
                piece.style.transform = 'none';
                targetSlot.innerHTML = ''; 
                targetSlot.appendChild(piece);
                
                // Trigger Error state
                piece.classList.add('error');
                mistakesCount++;
                updateLivesDisplay();

                setTimeout(() => {
                    piece.classList.remove('error');
                    
                    if (!isTarget) {
                        // It's a decoy letter, let it fade and be destroyed
                        piece.classList.add('fade-out');
                        setTimeout(() => piece.remove(), 300);
                    } else {
                        // It's a target letter but in the wrong order. Return it to scattered pool so game is still winnable.
                        piece.classList.add('scattered');
                        const randomRot = Math.floor(Math.random() * 40) - 20;
                        piece.style.setProperty('--rot', `${randomRot}deg`);
                        scatteredArea.appendChild(piece);
                    }

                    // Check Game Over
                    if (mistakesCount >= maxMistakes) {
                        const gameOverOverlay = document.getElementById('game-over-overlay');
                        gameOverOverlay.classList.remove('hidden');
                        gameOverOverlay.classList.add('flex');
                        setTimeout(() => {
                            gameOverOverlay.style.opacity = '1';
                        }, 50);
                    } else {
                        isAnimating = false; // Allow next click
                    }
                }, 600);
            }
        }

        function updateProgress() {
            const bar = document.getElementById('progress-bar');
            const percentage = (currentIndex / targetWord.length) * 100;
            bar.style.width = `${percentage}%`;
        }

        function handleWinSequence() {
            if (window.innerHeight > window.innerWidth) {
                const overlay = document.getElementById('rotate-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                
                setTimeout(() => {
                    overlay.style.opacity = '1';
                }, 50);

                const rotationListener = () => {
                    if (window.innerWidth > window.innerHeight) {
                        window.removeEventListener('resize', rotationListener);
                        window.removeEventListener('orientationchange', rotationListener);
                        
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.classList.add('hidden');
                            overlay.classList.remove('flex');
                            showWish();
                            fireConfetti();
                        }, 500); 
                    }
                };

                window.addEventListener('resize', rotationListener);
                window.addEventListener('orientationchange', rotationListener);
            } else {
                showWish();
                fireConfetti();
            }
        }

        function showWish() {
            const initial = document.getElementById('initial-state');
            initial.style.opacity = '0';
            setTimeout(() => {
                initial.classList.add('hidden');
                document.getElementById('wish-state').classList.remove('hidden');
                typeWriter(wishMessage, "typing-text");
            }, 500);
        }

        function typeWriter(text, elementId) {
            const element = document.getElementById(elementId);
            let i = 0;
            element.innerHTML = '';
            
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            
            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1);
                    element.appendChild(cursor);
                    i++;
                    setTimeout(type, 45);
                } else {
                    document.getElementById('restart-btn').classList.remove('hidden');
                    cursor.style.display = 'none';
                }
            }
            
            type();
        }

        function fireConfetti() {
            const colors = ['#ec4899', '#8b5cf6', '#f43f5e', '#3b82f6', '#facc15', '#a855f7'];
            const panel = document.getElementById('wish-panel');
            
            for (let i = 0; i < 70; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = `${Math.random() * 100}%`;
                conf.style.top = `-10px`;
                
                if (Math.random() > 0.5) conf.style.borderRadius = '50%';
                
                panel.appendChild(conf);
                
                const duration = Math.random() * 2.5 + 2;
                const delay = Math.random() * 1.5;
                
                conf.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg) scale(1)`, opacity: 1 },
                    { transform: `translate3d(${Math.random() * 200 - 100}px, ${panel.offsetHeight + 50}px, 0) rotate(${Math.random() * 720 + 360}deg) scale(0.5)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });

                setTimeout(() => conf.remove(), (duration + delay) * 1000);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
